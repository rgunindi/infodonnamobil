[package]
name = "infodonnamobil"
version = "0.1.0"
authors = ["Ramazan G. <codmyhesap@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "infodonnamobil-desktop"
path = "gen/bin/desktop.rs"

[package.metadata.cargo-android]
app-activity-name = "com.example.infodonnamobil.MainActivity"
app-dependencies = [
    "androidx.webkit:webkit:1.6.1",
    "androidx.appcompat:appcompat:1.6.1",
    "com.google.android.material:material:1.8.0",
]
project-dependencies = [ "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.21" ]
app-plugins = [ "org.jetbrains.kotlin.android" ]
app-permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_NETWORK_STATE"
]
app-theme-parent = "Theme.MaterialComponents.DayNight.DarkActionBar"
vulkan-validation = false
build-targets = ["aarch64-linux-android", "armv7-linux-androideabi"]




[package.metadata.cargo-android.env-vars]
WRY_ANDROID_PACKAGE = "com.example.infodonnamobil"
WRY_ANDROID_LIBRARY = "infodonnamobil"
WRY_ANDROID_KOTLIN_FILES_OUT_DIR = "<android-project-dir>/app/src/main/kotlin/com/example/infodonnamobil"

[package.metadata.cargo-apple.ios]
frameworks = [ "WebKit" ]

[dependencies]
log = "0.4"
# wry = "0.37"
# tao = "0.26"
dioxus = { version = "*", features = ["fullstack","dioxus-cli-config"] }
markdown = "0.3.0"
mongodb = {version="3.1.0", optional = true }
futures = { version = "0.3.30", optional = true }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"], optional=true }
dotenv = "0.15"
tokio = { version = "1.30.0", features = ["full"], optional = true }
axum = { version = "0.7.0", optional = true }
gloo-timers = { version = "0.3.0", features = ["futures"] }
dioxus-cli-config = { version = "*", optional = false, features = [] }

[features]
server=["dioxus/server","dep:mongodb","dep:serde","dep:futures","dep:tokio","dep:axum"]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
# dioxus-cli-config = ["dep:dioxus-cli-config"]
# mobile = ["dioxus/mobile"]


[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
jni = "0.21.0"
paste = "1.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.9.0"

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
